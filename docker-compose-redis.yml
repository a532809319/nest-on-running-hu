# version: '3.8'

services:
  redis-1:
    image: redis:7.0.12-alpine # 可以根据需要选择Redis版本
    container_name: redis-1
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "10001:6379"
      - "10007:16379" # Cluster bus port
    volumes:
      - ./redis-data/redis-1:/data
      - ./redis-conf/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PORT=6379
      - REDIS_CLUSTER_ANNOUNCE_PORT=10001
      - REDIS_CLUSTER_ANNOUNCE_BUS_PORT=10007
    networks:
      redis-cluster-net:
        ipv4_address: 172.20.0.11

  redis-2:
    image: redis:7.0.12-alpine
    container_name: redis-2
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "10002:6379"
      - "10008:16379"
    volumes:
      - ./redis-data/redis-2:/data
      - ./redis-conf/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PORT=6379
      - REDIS_CLUSTER_ANNOUNCE_PORT=10002
      - REDIS_CLUSTER_ANNOUNCE_BUS_PORT=10008
    networks:
      redis-cluster-net:
        ipv4_address: 172.20.0.12

  redis-3:
    image: redis:7.0.12-alpine
    container_name: redis-3
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "10003:6379"
      - "10009:16379"
    volumes:
      - ./redis-data/redis-3:/data
      - ./redis-conf/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PORT=6379
      - REDIS_CLUSTER_ANNOUNCE_PORT=10003
      - REDIS_CLUSTER_ANNOUNCE_BUS_PORT=10009
    networks:
      redis-cluster-net:
        ipv4_address: 172.20.0.13

  redis-4:
    image: redis:7.0.12-alpine
    container_name: redis-4
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "10004:6379"
      - "10010:16379"
    volumes:
      - ./redis-data/redis-4:/data
      - ./redis-conf/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PORT=6379
      - REDIS_CLUSTER_ANNOUNCE_PORT=10004
      - REDIS_CLUSTER_ANNOUNCE_BUS_PORT=10010
    networks:
      redis-cluster-net:
        ipv4_address: 172.20.0.14

  redis-5:
    image: redis:7.0.12-alpine
    container_name: redis-5
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "10005:6379"
      - "10011:16379"
    volumes:
      - ./redis-data/redis-5:/data
      - ./redis-conf/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PORT=6379
      - REDIS_CLUSTER_ANNOUNCE_PORT=10005
      - REDIS_CLUSTER_ANNOUNCE_BUS_PORT=10011
    networks:
      redis-cluster-net:
        ipv4_address: 172.20.0.15

  redis-6:
    image: redis:7.0.12-alpine
    container_name: redis-6
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "10006:6379"
      - "10012:16379"
    volumes:
      - ./redis-data/redis-6:/data
      - ./redis-conf/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PORT=6379
      - REDIS_CLUSTER_ANNOUNCE_PORT=10006
      - REDIS_CLUSTER_ANNOUNCE_BUS_PORT=10012
    networks:
      redis-cluster-net:
        ipv4_address: 172.20.0.16

  redis-cluster-creator:
    image: redis:7.0.12-alpine
    container_name: redis-cluster-creator
    command: >
      sh -c "
        sleep 20 &&
        redis-cli --cluster create
        172.20.0.11:6379
        172.20.0.12:6379
        172.20.0.13:6379
        172.20.0.14:6379
        172.20.0.15:6379
        172.20.0.16:6379
        --cluster-replicas 1
        --cluster-yes
      "
    networks:
      - redis-cluster-net
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6

networks:
  redis-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  redis-data: