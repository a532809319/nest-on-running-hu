port 6379
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
appendonly yes
bind 0.0.0.0
protected-mode no
# 注意: cluster-announce-ip, cluster-announce-port, cluster-announce-bus-port
# 这些在 docker-compose.yml 中通过环境变量设置，因为它们需要针对每个容器动态变化。
# 如果你的Redis版本不支持环境变量覆盖，或者你希望在配置文件中固定，
# 需要为每个节点创建单独的redis.conf文件，并修改其相应的配置。