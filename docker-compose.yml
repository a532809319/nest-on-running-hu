# version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"


      

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      NODE_ENV: production
      DB_HOST: localhost
      DB_PORT: 3306
      DB_USERNAME: user
      DB_PASSWORD: pass
      DB_DATABASE: inventory_db
      DB_SYNCHRONIZE: true
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_TTL: 3600
      JWT_SECRET: a-string-secret-at-least-bits-long
      JWT_EXPIRES_IN: 60d


  # order-service:
  #   build: ./run-order-app
  #   ports:
  #     - "3007:3007"
  #   depends_on:
  #     - mysql
  #     - redis
  #     - rabbitmq
  #   environment:
  #     NODE_ENV: production

  auth-service:
    build: ./run-auth-app
    ports:
      - "3008:3008"
    depends_on:
      - mysql
      - redis
      - rabbitmq
    environment:
      NODE_ENV: production
      DB_HOST: mysql
