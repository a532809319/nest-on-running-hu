# version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"


      

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  order-service:
    build: ./run-order-app
    ports:
      - "3007:3007"
    depends_on:
      - mysql
      - redis
      - rabbitmq


  auth-service:
    build: ./run-auth-app
    ports:
      - "3008:3008"
    depends_on:
      - mysql
      - redis
      - rabbitmq
  inventory-service:
    build: ./run-inventory-app
    ports:
      - "3009:3009"
    depends_on:
      - mysql
      - redis
      - rabbitmq
      

volumes:
  mysql-data:

  